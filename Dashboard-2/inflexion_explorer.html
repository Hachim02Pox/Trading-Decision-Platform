<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Inflexion Explorer — Trading Decision Platform</title>
<style>
:root {
  --bg: #0f1420;
  --bg-panel: #161d2e;
  --bg-panel-alt: #1c2438;
  --border: #2a334a;
  --text: #e5e9f2;
  --text-dim: #9aa4bd;
  --accent: #38bdf8;
  --win: #4ade80;
  --loss: #f87171;
  --long: #60a5fa;
  --short: #fbbf24;
}

* { box-sizing: border-box; }
html, body { height: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 14px;
  line-height: 1.5;
}

.app-root { display: flex; flex-direction: column; height: 100vh; }

.app-topbar {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 20px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--border);
  gap: 12px;
  flex-wrap: wrap;
}
.app-topbar-title { font-size: 13px; font-weight: 600; color: var(--text-dim); }
.app-view-switch { display: flex; gap: 4px; flex-wrap: wrap; }
.view-btn { background: none; border: 1px solid var(--border); color: var(--text-dim); padding: 7px 14px; font-size: 12.5px; border-radius: 8px; cursor: pointer; }
.view-btn:hover { color: var(--text); }
.view-btn.active { color: var(--text); background: rgba(56, 189, 248, 0.12); border-color: var(--accent); font-weight: 600; }

.app-shell { display: flex; flex: 1; min-height: 0; }
.app-shell[hidden], .crossing-view[hidden] { display: none; }
.crossing-view { flex: 1; overflow-y: auto; padding: 24px 32px 48px; }

/* Sidebar */
.sidebar {
  width: 300px;
  flex: 0 0 300px;
  background: var(--bg-panel);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.sidebar-header { padding: 20px 18px 12px; border-bottom: 1px solid var(--border); }
.sidebar-header h1 { font-size: 16px; margin: 0 0 4px; }
.sidebar-header p { margin: 0; color: var(--text-dim); font-size: 12px; }

.feature-list { list-style: none; margin: 0; padding: 8px; flex: 1; }

.feature-item {
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  margin-bottom: 2px;
  border: 1px solid transparent;
}
.feature-item:hover { background: var(--bg-panel-alt); }
.feature-item.selected { background: rgba(56, 189, 248, 0.12); border-color: var(--accent); }
.feature-item-name { font-size: 13px; font-weight: 600; }
.feature-item-range { font-size: 11px; color: var(--text-dim); margin-top: 2px; }

/* Main */
.main { flex: 1; overflow-y: auto; padding: 24px 32px 48px; min-width: 0; }
.main-header h2 { margin: 0 0 4px; font-size: 22px; }
.main-header .feature-desc { margin: 0 0 4px; color: var(--text-dim); font-size: 13px; }
.main-header .scope-note { margin: 0 0 20px; color: var(--text-dim); font-size: 12px; }

.kpi-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 12px;
}
.kpi-card { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; }
.kpi-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
.kpi-value { font-size: 22px; font-weight: 700; }

.null-note {
  color: var(--short);
  font-size: 12px;
  margin: 0 0 20px;
  padding: 8px 12px;
  background: rgba(251, 191, 36, 0.08);
  border: 1px solid rgba(251, 191, 36, 0.3);
  border-radius: 8px;
}

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
.tab-btn { background: none; border: none; color: var(--text-dim); padding: 10px 16px; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; }
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }

.tab-content { display: flex; flex-direction: column; gap: 20px; }
.panel { background: var(--bg-panel); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; }
.panel h3 { margin: 0 0 10px; font-size: 14px; }

.chart-container { width: 100%; }
.chart-svg { width: 100%; height: auto; display: block; }
.chart-note { color: var(--text-dim); font-size: 11px; margin: 8px 0 0; }
.explain-text { color: var(--text-dim); font-size: 12.5px; margin: 8px 0 0; }
.synthesis-text { margin: 0; font-size: 14px; }

.effect-size-row { display: flex; align-items: center; gap: 10px; margin: 10px 0; flex-wrap: wrap; }
.effect-size-badge {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 999px;
  font-size: 12.5px;
  font-weight: 700;
  border: 1px solid var(--border);
}
.effect-size-badge.level-1 { background: rgba(74, 222, 128, 0.12); color: var(--win); border-color: rgba(74, 222, 128, 0.4); }
.effect-size-badge.level-2 { background: rgba(56, 189, 248, 0.12); color: var(--accent); border-color: rgba(56, 189, 248, 0.4); }
.effect-size-badge.level-3 { background: rgba(251, 191, 36, 0.12); color: var(--short); border-color: rgba(251, 191, 36, 0.4); }
.effect-size-badge.level-4 { background: rgba(248, 113, 113, 0.12); color: var(--loss); border-color: rgba(248, 113, 113, 0.4); }
.effect-size-value { color: var(--text-dim); font-size: 12.5px; }

.interval-summary { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 10px; }
.interval-stat { background: var(--bg-panel-alt); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; min-width: 100px; }
.interval-stat-label { display: block; font-size: 10.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 3px; }
.interval-stat-value { display: block; font-size: 15px; font-weight: 700; }

.warning-text {
  background: rgba(251, 191, 36, 0.1);
  border: 1px solid rgba(251, 191, 36, 0.4);
  border-radius: 8px;
  padding: 10px 14px;
  font-size: 12.5px;
  color: #fde68a;
  margin: 10px 0 0;
}
.warning-box-strong {
  background: rgba(248, 113, 113, 0.12);
  border: 1px solid rgba(248, 113, 113, 0.5);
  border-radius: 10px;
  padding: 16px 18px;
  font-size: 13.5px;
  color: #fecaca;
  margin-bottom: 20px;
  line-height: 1.55;
}

.crossing-header h2 { margin: 0 0 4px; font-size: 22px; }
.crossing-header p { margin: 0 0 20px; color: var(--text-dim); font-size: 12px; }
.crossing-result-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 8px; }
.crossing-empty-note { color: var(--text-dim); font-size: 12.5px; margin: 8px 0 0; }

.funnel-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.funnel-table th, .funnel-table td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.funnel-table th { color: var(--text-dim); font-weight: 600; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em; }
.funnel-table tr:last-child td { font-weight: 700; color: var(--text); }

.chart-legend { display: flex; gap: 18px; margin-bottom: 10px; font-size: 12px; color: var(--text-dim); }
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.legend-swatch { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

.stat-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.stat-table th, .stat-table td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); }
.stat-table th { color: var(--text-dim); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }

.term { border-bottom: 1px dotted var(--text-dim); cursor: help; }

.chart-gridline { stroke: var(--border); stroke-width: 1; }
.chart-axis-line { stroke: var(--text-dim); stroke-width: 1; }
.chart-axis-text { fill: var(--text-dim); font-size: 9px; }
.chart-empty-text { fill: var(--text-dim); font-size: 12px; }
.chart-highlight-band { fill: rgba(251, 191, 36, 0.14); stroke: rgba(251, 191, 36, 0.55); stroke-width: 1; stroke-dasharray: 4 3; }
.chart-outlier-mark { fill: var(--loss); opacity: 0.85; }
.chart-outlier-dot { opacity: 0.9; stroke: var(--bg-panel); stroke-width: 1; }
.chart-whisker { stroke-width: 1.5; }
.chart-median { stroke-width: 2; }

@media (max-width: 900px) {
  .app-shell { flex-direction: column; height: auto; }
  .sidebar { width: 100%; flex: none; max-height: 260px; }
  .kpi-row { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
  <div class="app-root">
    <header class="app-topbar">
      <div class="app-topbar-title">Trading Decision Platform — Dashboard 2</div>
      <nav class="app-view-switch" id="app-view-switch">
        <button class="view-btn active" data-view="explorer">Inflexion Explorer</button>
        <button class="view-btn" data-view="crossing">Croisement des intervalles</button>
        <button class="view-btn" data-view="combo">Meilleure combinaison observée</button>
        <button class="view-btn" data-view="signal">Y a-t-il un signal ?</button>
      </nav>
    </header>

    <div class="app-shell" id="view-explorer">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h1>Inflexion Explorer</h1>
          <p>1 558 bougies · 1 295 setups · 12 features</p>
        </div>
        <ul class="feature-list" id="feature-list"></ul>
      </aside>

      <main class="main">
        <header class="main-header">
          <h2 id="feature-title"></h2>
          <p class="feature-desc" id="feature-desc"></p>
          <p class="scope-note">Statistiques calculées sur les bougies d'inflexion valides de cet échantillon. Aucune prédiction, aucune recommandation.</p>
        </header>

        <section class="kpi-row" id="kpi-row"></section>
        <div id="null-note-slot"></div>

        <nav class="tabs" id="tabs">
          <button class="tab-btn active" data-tab="distribution">Distribution</button>
          <button class="tab-btn" data-tab="outcome">WIN vs LOSS</button>
          <button class="tab-btn" data-tab="direction">LONG vs SHORT</button>
        </nav>

        <section class="tab-content" id="tab-content"></section>
      </main>
    </div>

    <div class="crossing-view" id="view-crossing" hidden></div>
    <div class="crossing-view" id="view-combo" hidden></div>
    <div class="crossing-view" id="view-signal" hidden></div>
  </div>

  <script src="inflexion_data.json"></script>
  <script>
"use strict";

// =====================================================================
// stats — same primitives as Dashboard 1's stats.js (percentiles via
// linear interpolation, sample stddev, IQR x1.5 outliers), plus a robust
// (median/MAD-based) Cohen's d for the group-difference conclusion that
// Dashboard 2 asks for and Dashboard 1 did not have.
// =====================================================================

function toValidNumbers(values) {
  const out = [];
  for (let i = 0; i < values.length; i++) {
    const v = values[i];
    if (typeof v === "number" && Number.isFinite(v)) out.push(v);
  }
  return out;
}

function mean(values) {
  const v = toValidNumbers(values);
  if (v.length === 0) return null;
  let sum = 0;
  for (let i = 0; i < v.length; i++) sum += v[i];
  return sum / v.length;
}

function median(values) {
  const v = toValidNumbers(values).slice().sort((a, b) => a - b);
  if (v.length === 0) return null;
  const mid = Math.floor(v.length / 2);
  return v.length % 2 === 0 ? (v[mid - 1] + v[mid]) / 2 : v[mid];
}

function percentile(values, p) {
  const v = toValidNumbers(values).slice().sort((a, b) => a - b);
  if (v.length === 0) return null;
  if (v.length === 1) return v[0];
  const rank = p * (v.length - 1);
  const lower = Math.floor(rank);
  const upper = Math.ceil(rank);
  if (lower === upper) return v[lower];
  const frac = rank - lower;
  return v[lower] + (v[upper] - v[lower]) * frac;
}

function percentiles(values, ps) {
  const v = toValidNumbers(values).slice().sort((a, b) => a - b);
  const result = {};
  for (let i = 0; i < ps.length; i++) result[ps[i]] = percentile(v, ps[i]);
  return result;
}

function stdDev(values) {
  const v = toValidNumbers(values);
  if (v.length < 2) return null;
  const m = mean(v);
  let sumSq = 0;
  for (let i = 0; i < v.length; i++) { const d = v[i] - m; sumSq += d * d; }
  return Math.sqrt(sumSq / (v.length - 1));
}

function min(values) {
  const v = toValidNumbers(values);
  return v.length === 0 ? null : Math.min.apply(null, v);
}
function max(values) {
  const v = toValidNumbers(values);
  return v.length === 0 ? null : Math.max.apply(null, v);
}

function iqrOutliers(values) {
  const v = toValidNumbers(values);
  const p25 = percentile(v, 0.25);
  const p75 = percentile(v, 0.75);
  if (p25 === null || p75 === null) return { iqr: null, lowerBound: null, upperBound: null, outliers: [], count: 0 };
  const iqr = p75 - p25;
  const lowerBound = p25 - 1.5 * iqr;
  const upperBound = p75 + 1.5 * iqr;
  const outliers = v.filter((x) => x < lowerBound || x > upperBound);
  return { iqr, lowerBound, upperBound, outliers, count: outliers.length };
}

function describe(values) {
  const v = toValidNumbers(values);
  const outlierInfo = iqrOutliers(v);
  return {
    n: v.length,
    mean: mean(v),
    median: median(v),
    stdDev: stdDev(v),
    min: min(v),
    max: max(v),
    percentiles: percentiles(v, [0.01, 0.1, 0.25, 0.5, 0.75, 0.9, 0.99]),
    outlierCount: outlierInfo.count,
  };
}

function histogramBins(values, p1, p99, binCount) {
  const v = toValidNumbers(values);
  const bins = new Array(binCount).fill(0);
  if (v.length === 0 || p1 === null || p99 === null || p1 === p99) return { bins, edges: [], binWidth: 0 };
  const binWidth = (p99 - p1) / binCount;
  const edges = [];
  for (let i = 0; i <= binCount; i++) edges.push(p1 + i * binWidth);
  for (let i = 0; i < v.length; i++) {
    let idx = Math.floor((v[i] - p1) / binWidth);
    if (idx < 0) idx = 0;
    if (idx >= binCount) idx = binCount - 1;
    bins[idx]++;
  }
  return { bins, edges, binWidth };
}

/**
 * Robust (median/MAD-based) Cohen's d: classic pooled-effect-size formula,
 * but with each group's standard deviation replaced by its scaled median
 * absolute deviation (MAD x 1.4826, a robust estimator of spread that is
 * far less pulled around by outliers than the mean/stddev version).
 * Returns null when undefined (fewer than 2 valid values in a group, or
 * a pooled spread of zero).
 */
function robustCohensD(valuesA, valuesB) {
  const a = toValidNumbers(valuesA);
  const b = toValidNumbers(valuesB);
  const nA = a.length, nB = b.length;
  if (nA < 2 || nB < 2) return null;
  const medA = median(a);
  const medB = median(b);
  const madA = median(a.map((x) => Math.abs(x - medA))) * 1.4826;
  const madB = median(b.map((x) => Math.abs(x - medB))) * 1.4826;
  const pooled = Math.sqrt(((nA - 1) * madA * madA + (nB - 1) * madB * madB) / (nA + nB - 2));
  if (!Number.isFinite(pooled) || pooled === 0) return null;
  return (medA - medB) / pooled;
}

function cohensDLevel(absD) {
  if (absD < 0.2) return { label: "Très faible", cls: "level-1" };
  if (absD < 0.5) return { label: "Faible", cls: "level-2" };
  if (absD < 0.8) return { label: "Modérée", cls: "level-3" };
  return { label: "Marquée", cls: "level-4" };
}

/**
 * Mann-Whitney-style probability of superiority: probability that a value
 * drawn at random from `valuesA` exceeds one drawn at random from
 * `valuesB` (ties count as 0.5). 0.5 = the two groups are indistinguishable
 * on this variable; near 0 or near 1 = they are almost fully separated.
 * Purely descriptive, computed once per feature — no search, no threshold.
 */
function probabilityOfSuperiority(valuesA, valuesB) {
  const a = toValidNumbers(valuesA);
  const b = toValidNumbers(valuesB);
  const nA = a.length, nB = b.length;
  if (nA === 0 || nB === 0) return null;

  const combined = a.map((v) => ({ v, group: "A" })).concat(b.map((v) => ({ v, group: "B" })));
  combined.sort((x, y) => x.v - y.v);

  const n = combined.length;
  const ranks = new Array(n);
  let i = 0;
  while (i < n) {
    let j = i;
    while (j + 1 < n && combined[j + 1].v === combined[i].v) j++;
    const avgRank = (i + j) / 2 + 1;
    for (let k = i; k <= j; k++) ranks[k] = avgRank;
    i = j + 1;
  }

  let rankSumA = 0;
  for (let k = 0; k < n; k++) if (combined[k].group === "A") rankSumA += ranks[k];
  const uA = rankSumA - (nA * (nA + 1)) / 2;
  return uA / (nA * nB);
}

// =====================================================================
// intervals — addendum ported from Dashboard 1: per-feature "best
// observed WIN/LOSS ratio interval" search (Wilson score lower bound),
// the isolated naive crossing of all 12 individual intervals, and a
// greedy joint-combination search. See Dashboard 1's Prompt2/Prompt3.
// =====================================================================

const WILSON_Z = 1.96;
const MIN_INTERVAL_N = 10;

function wilsonLowerBound(nWin, nTotal) {
  if (nTotal === 0) return null;
  const z = WILSON_Z;
  const phat = nWin / nTotal;
  const denom = 1 + (z * z) / nTotal;
  const center = phat + (z * z) / (2 * nTotal);
  const margin = z * Math.sqrt((phat * (1 - phat)) / nTotal + (z * z) / (4 * nTotal * nTotal));
  return (center - margin) / denom;
}

function candidateBreakpoints(values) {
  const set = new Set();
  for (let i = 0; i <= 100; i++) {
    const p = percentile(values, i / 100);
    if (p !== null) set.add(p);
  }
  return Array.from(set).sort((a, b) => a - b);
}

function findBestInterval(values, outcomes) {
  const pairs = [];
  for (let i = 0; i < values.length; i++) {
    const v = values[i];
    const o = outcomes[i];
    if (Number.isFinite(v) && (o === "WIN" || o === "LOSS")) pairs.push({ v, isWin: o === "WIN" });
  }
  pairs.sort((a, b) => a.v - b.v);

  const n = pairs.length;
  const sortedValues = pairs.map((p) => p.v);
  const prefixWin = new Array(n + 1).fill(0);
  for (let i = 0; i < n; i++) prefixWin[i + 1] = prefixWin[i] + (pairs[i].isWin ? 1 : 0);

  function countBelow(target) {
    let lo = 0, hi = n;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (sortedValues[mid] < target) lo = mid + 1; else hi = mid; }
    return lo;
  }
  function countAtMost(target) {
    let lo = 0, hi = n;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (sortedValues[mid] <= target) lo = mid + 1; else hi = mid; }
    return lo;
  }

  const breakpoints = candidateBreakpoints(sortedValues);
  let best = null;

  for (let i = 0; i < breakpoints.length; i++) {
    const lo = breakpoints[i];
    const startIdx = countBelow(lo);
    for (let j = i + 1; j < breakpoints.length; j++) {
      const hi = breakpoints[j];
      const endIdx = countAtMost(hi);
      const nTotal = endIdx - startIdx;
      if (nTotal < MIN_INTERVAL_N) continue;
      const nWin = prefixWin[endIdx] - prefixWin[startIdx];
      const nLoss = nTotal - nWin;
      const score = wilsonLowerBound(nWin, nTotal);
      if (best === null || score > best.score) best = { lo, hi, nWin, nLoss, nTotal, ratio: nWin / nTotal, score };
    }
  }
  return best;
}

function extractFeatureOutcomePairs(feature) {
  const values = [];
  const outcomes = [];
  for (let i = 0; i < inflexionData.length; i++) {
    const v = inflexionData[i][feature];
    if (Number.isFinite(v)) { values.push(v); outcomes.push(inflexionData[i].Outcome); }
  }
  return { values, outcomes };
}

const bestIntervalCache = {};
function getBestIntervalForFeature(feature) {
  if (!(feature in bestIntervalCache)) {
    const { values, outcomes } = extractFeatureOutcomePairs(feature);
    bestIntervalCache[feature] = findBestInterval(values, outcomes);
  }
  return bestIntervalCache[feature];
}

function countOutcomesForIndices(indices) {
  let nWin = 0, nLoss = 0;
  for (let k = 0; k < indices.length; k++) {
    const o = inflexionData[indices[k]].Outcome;
    if (o === "WIN") nWin++; else if (o === "LOSS") nLoss++;
  }
  return { nWin, nLoss, nTotal: indices.length };
}

/**
 * Naive crossing (section 7 of Dashboard 1's addendum): applies each
 * feature's own best interval cumulatively, in Wilson-score-descending
 * order. Deliberately isolated — stacking already-optimized filters
 * compounds overfitting risk, often collapsing the sample to 0.
 */
function computeCrossing(features) {
  const perFeature = features.map((f) => ({ feature: f, interval: getBestIntervalForFeature(f) }));
  const usable = perFeature.filter((x) => x.interval !== null);
  const excluded = perFeature.filter((x) => x.interval === null).map((x) => x.feature);
  const ordered = usable.slice().sort((a, b) => b.interval.score - a.interval.score);

  let currentIndices = inflexionData.map((_, i) => i);
  const funnel = [{ step: 0, feature: null, interval: null, ...countOutcomesForIndices(currentIndices) }];

  ordered.forEach((item, idx) => {
    const { feature, interval } = item;
    currentIndices = currentIndices.filter((i) => {
      const v = inflexionData[i][feature];
      return Number.isFinite(v) && v >= interval.lo && v <= interval.hi;
    });
    funnel.push({ step: idx + 1, feature, interval, ...countOutcomesForIndices(currentIndices) });
  });

  return { perFeature, ordered, excluded, funnel, final: funnel[funnel.length - 1] };
}

function extractFeatureOutcomePairsForIndices(feature, indices) {
  const values = [];
  const outcomes = [];
  for (let k = 0; k < indices.length; k++) {
    const row = inflexionData[indices[k]];
    const v = row[feature];
    if (Number.isFinite(v)) { values.push(v); outcomes.push(row.Outcome); }
  }
  return { values, outcomes };
}

function bestIntervalOnIndices(feature, indices) {
  const { values, outcomes } = extractFeatureOutcomePairsForIndices(feature, indices);
  return findBestInterval(values, outcomes);
}

/**
 * Greedy forward search for the "best observed combination": at each
 * step, tries every not-yet-used feature's best interval *on the sample
 * already narrowed by prior steps*, keeps whichever single addition
 * raises the Wilson score the most, stops as soon as nothing improves it.
 * A heuristic, not an exhaustive search over all combinations.
 */
function computeGreedyBestCombination(features) {
  let currentIndices = inflexionData.map((_, i) => i);
  let remaining = features.slice();

  const initCounts = countOutcomesForIndices(currentIndices);
  let currentScore = wilsonLowerBound(initCounts.nWin, initCounts.nTotal);
  const steps = [{ step: 0, feature: null, interval: null, score: currentScore, ...initCounts }];

  while (remaining.length > 0) {
    let bestCandidate = null;
    for (let i = 0; i < remaining.length; i++) {
      const f = remaining[i];
      const candidateBest = bestIntervalOnIndices(f, currentIndices);
      if (!candidateBest) continue;
      if (!bestCandidate || candidateBest.score > bestCandidate.interval.score) bestCandidate = { feature: f, interval: candidateBest };
    }

    if (!bestCandidate || bestCandidate.interval.score <= currentScore) break;

    const { feature, interval } = bestCandidate;
    currentIndices = currentIndices.filter((i) => {
      const v = inflexionData[i][feature];
      return Number.isFinite(v) && v >= interval.lo && v <= interval.hi;
    });
    currentScore = interval.score;
    remaining = remaining.filter((f) => f !== feature);

    const counts = countOutcomesForIndices(currentIndices);
    steps.push({ step: steps.length, feature, interval, score: currentScore, ...counts });
  }

  return { steps, finalIndices: currentIndices, final: steps[steps.length - 1], featuresUsed: steps.length - 1, featuresUnused: remaining };
}

const SVG_NS = "http://www.w3.org/2000/svg";
function svgEl(tag, attrs) {
  const el = document.createElementNS(SVG_NS, tag);
  if (attrs) for (const key in attrs) el.setAttribute(key, attrs[key]);
  return el;
}
function clearElement(el) { while (el.firstChild) el.removeChild(el.firstChild); }
function formatNum(v, decimals) {
  if (v === null || v === undefined || !Number.isFinite(v)) return "—";
  const d = decimals === undefined ? 3 : decimals;
  return Number(v.toFixed(d)).toString();
}

function renderHistogram(container, opts) {
  clearElement(container);
  const width = 640, height = 260;
  const margin = { top: 16, right: 20, bottom: 40, left: 44 };
  const plotW = width - margin.left - margin.right;
  const plotH = height - margin.top - margin.bottom;
  const binCount = opts.binCount || 28;

  const svg = svgEl("svg", { viewBox: `0 0 ${width} ${height}`, class: "chart-svg", role: "img", "aria-label": "Histogramme" });

  const p1 = opts.p1, p99 = opts.p99;
  const validFrame = p1 !== null && p99 !== null && p1 !== p99;
  if (!validFrame) {
    const msg = svgEl("text", { x: width / 2, y: height / 2, class: "chart-empty-text", "text-anchor": "middle" });
    msg.textContent = "Données insuffisantes pour tracer un histogramme.";
    svg.appendChild(msg);
    container.appendChild(svg);
    return;
  }

  const binned = opts.series.map((s) => histogramBins(s.values, p1, p99, binCount));
  let maxCount = 1;
  binned.forEach((b) => b.bins.forEach((c) => { if (c > maxCount) maxCount = c; }));

  const xScale = (v) => margin.left + ((v - p1) / (p99 - p1)) * plotW;
  const yScale = (c) => margin.top + plotH - (c / maxCount) * plotH;

  if (opts.highlightRange) {
    let [hlLo, hlHi] = opts.highlightRange;
    if (hlLo < p1) hlLo = p1;
    if (hlHi > p99) hlHi = p99;
    if (hlHi > hlLo) {
      const xLo = xScale(hlLo);
      const xHi = xScale(hlHi);
      svg.appendChild(svgEl("rect", { x: xLo, y: margin.top, width: xHi - xLo, height: plotH, class: "chart-highlight-band" }));
    }
  }

  const yTicks = 4;
  for (let i = 0; i <= yTicks; i++) {
    const c = (maxCount / yTicks) * i;
    const y = yScale(c);
    svg.appendChild(svgEl("line", { x1: margin.left, x2: margin.left + plotW, y1: y, y2: y, class: "chart-gridline" }));
    const t = svgEl("text", { x: margin.left - 8, y: y + 3, class: "chart-axis-text", "text-anchor": "end" });
    t.textContent = Math.round(c).toString();
    svg.appendChild(t);
  }

  const xTicks = 5;
  for (let i = 0; i <= xTicks; i++) {
    const v = p1 + ((p99 - p1) / xTicks) * i;
    const x = xScale(v);
    const t = svgEl("text", { x: x, y: margin.top + plotH + 18, class: "chart-axis-text", "text-anchor": "middle" });
    t.textContent = formatNum(v, 2);
    svg.appendChild(t);
  }

  const barGap = 1;
  binned.forEach((b, seriesIdx) => {
    const s = opts.series[seriesIdx];
    const group = svgEl("g", { class: "chart-series" });
    for (let i = 0; i < b.bins.length; i++) {
      const count = b.bins[i];
      if (count === 0) continue;
      const x0 = xScale(b.edges[i]);
      const x1 = xScale(b.edges[i + 1]);
      const y = yScale(count);
      const rect = svgEl("rect", {
        x: x0 + barGap / 2, y: y, width: Math.max(0, x1 - x0 - barGap), height: margin.top + plotH - y,
        fill: s.color, "fill-opacity": opts.series.length > 1 ? 0.55 : 0.85, stroke: s.color, "stroke-width": 0.5,
      });
      const title = svgEl("title");
      title.textContent = `${s.label}: ${count} bougie(s) dans [${formatNum(b.edges[i], 3)}, ${formatNum(b.edges[i + 1], 3)}[`;
      rect.appendChild(title);
      group.appendChild(rect);
    }
    svg.appendChild(group);
  });

  svg.appendChild(svgEl("line", { x1: margin.left, x2: margin.left + plotW, y1: margin.top + plotH, y2: margin.top + plotH, class: "chart-axis-line" }));

  if (opts.markOutliers && opts.series.length === 1) {
    const info = iqrOutliers(opts.series[0].values);
    const rugY = margin.top + plotH + 30;
    info.outliers.forEach((v) => {
      let clamped = v;
      if (clamped < p1) clamped = p1;
      if (clamped > p99) clamped = p99;
      const x = xScale(clamped);
      const mark = svgEl("path", { d: `M ${x} ${rugY - 4} L ${x - 3.5} ${rugY + 3} L ${x + 3.5} ${rugY + 3} Z`, class: "chart-outlier-mark" });
      const title = svgEl("title");
      title.textContent = `Outlier : ${formatNum(v, 4)}`;
      mark.appendChild(title);
      svg.appendChild(mark);
    });
  }

  container.appendChild(svg);
}

function renderBoxplot(container, opts) {
  clearElement(container);
  const width = 640, rowHeight = 64;
  const margin = { top: 12, right: 24, bottom: 30, left: 90 };
  const groups = opts.groups;
  const plotW = width - margin.left - margin.right;
  const height = margin.top + margin.bottom + rowHeight * groups.length;

  const svg = svgEl("svg", { viewBox: `0 0 ${width} ${height}`, class: "chart-svg", role: "img", "aria-label": "Boxplot horizontal" });

  const [domMin, domMax] = opts.domain;
  const validDomain = domMin !== null && domMax !== null && domMin !== domMax;
  if (!validDomain) {
    const msg = svgEl("text", { x: width / 2, y: height / 2, class: "chart-empty-text", "text-anchor": "middle" });
    msg.textContent = "Données insuffisantes pour tracer un boxplot.";
    svg.appendChild(msg);
    container.appendChild(svg);
    return;
  }

  const xScale = (v) => margin.left + ((v - domMin) / (domMax - domMin)) * plotW;

  groups.forEach((g, i) => {
    const rowY = margin.top + i * rowHeight;
    const centerY = rowY + rowHeight / 2;
    const boxHalf = 14;

    const label = svgEl("text", { x: margin.left - 10, y: centerY + 4, class: "chart-axis-text", "text-anchor": "end" });
    label.textContent = `${g.label} (n=${toValidNumbers(g.values).length})`;
    svg.appendChild(label);

    const v = toValidNumbers(g.values);
    if (v.length === 0) {
      const noData = svgEl("text", { x: margin.left + 4, y: centerY + 4, class: "chart-empty-text" });
      noData.textContent = "n=0 — aucune donnée";
      svg.appendChild(noData);
      return;
    }

    const q1 = percentile(v, 0.25);
    const q3 = percentile(v, 0.75);
    const med = median(v);
    const outlierInfo = iqrOutliers(v);
    const inRange = v.filter((x) => x >= outlierInfo.lowerBound && x <= outlierInfo.upperBound);
    const whiskerLow = Math.min.apply(null, inRange.length ? inRange : v);
    const whiskerHigh = Math.max.apply(null, inRange.length ? inRange : v);

    const xWhiskerLow = xScale(whiskerLow);
    const xWhiskerHigh = xScale(whiskerHigh);
    const xQ1 = xScale(q1);
    const xQ3 = xScale(q3);
    const xMed = xScale(med);

    const g_ = svgEl("g", { class: "chart-series" });
    g_.appendChild(svgEl("line", { x1: xWhiskerLow, x2: xWhiskerHigh, y1: centerY, y2: centerY, class: "chart-whisker", stroke: g.color }));
    g_.appendChild(svgEl("line", { x1: xWhiskerLow, x2: xWhiskerLow, y1: centerY - 7, y2: centerY + 7, class: "chart-whisker", stroke: g.color }));
    g_.appendChild(svgEl("line", { x1: xWhiskerHigh, x2: xWhiskerHigh, y1: centerY - 7, y2: centerY + 7, class: "chart-whisker", stroke: g.color }));

    const box = svgEl("rect", {
      x: Math.min(xQ1, xQ3), y: centerY - boxHalf, width: Math.max(1, Math.abs(xQ3 - xQ1)), height: boxHalf * 2,
      fill: g.color, "fill-opacity": 0.35, stroke: g.color, "stroke-width": 1.5,
    });
    const boxTitle = svgEl("title");
    boxTitle.textContent = `${g.label} — Q1: ${formatNum(q1)}, médiane: ${formatNum(med)}, Q3: ${formatNum(q3)}`;
    box.appendChild(boxTitle);
    g_.appendChild(box);

    g_.appendChild(svgEl("line", { x1: xMed, x2: xMed, y1: centerY - boxHalf, y2: centerY + boxHalf, class: "chart-median", stroke: g.color }));

    outlierInfo.outliers.forEach((ov) => {
      const cx = xScale(ov);
      const dot = svgEl("circle", { cx, cy: centerY, r: 3, class: "chart-outlier-dot", fill: g.color });
      const t = svgEl("title");
      t.textContent = `Outlier : ${formatNum(ov, 4)}`;
      dot.appendChild(t);
      g_.appendChild(dot);
    });

    svg.appendChild(g_);
  });

  const axisY = margin.top + rowHeight * groups.length + 6;
  svg.appendChild(svgEl("line", { x1: margin.left, x2: margin.left + plotW, y1: axisY, y2: axisY, class: "chart-axis-line" }));
  const xTicks = 5;
  for (let i = 0; i <= xTicks; i++) {
    const v = domMin + ((domMax - domMin) / xTicks) * i;
    const x = xScale(v);
    const t = svgEl("text", { x, y: axisY + 16, class: "chart-axis-text", "text-anchor": "middle" });
    t.textContent = formatNum(v, 2);
    svg.appendChild(t);
  }

  container.appendChild(svg);
}

const GLOSSARY = {

  stddev: "Mesure de la dispersion des valeurs autour de la moyenne (écart-type d'échantillon).",
  iqr: "Écart interquartile (P75 − P25), utilisé pour repérer les valeurs atypiques.",
  outlier: "Valeur atypique : en dehors de [P25 − 1,5×IQR, P75 + 1,5×IQR]. Reste incluse dans tous les calculs.",
  cohend: "Cohen's d robuste : écart entre les médianes de deux groupes, rapporté à une dispersion robuste (MAD × 1,4826) au lieu de l'écart-type classique — moins sensible aux valeurs extrêmes.",
  wilson: "Borne basse de l'intervalle de confiance de Wilson à 95 %. Pénalise mathématiquement les petits échantillons, contrairement au ratio brut.",
};

const COLORS = { base: "#38bdf8", WIN: "#4ade80", LOSS: "#f87171", LONG: "#60a5fa", SHORT: "#fbbf24" };

const COMPARISONS = {

};

const state = { feature: FEATURES[0], tab: "distribution", view: "explorer" };

const featureCache = {};
function getFeatureValues(feature) {
  if (!featureCache[feature]) {
    const raw = inflexionData.map((d) => d[feature]);
    const valid = toValidNumbers(raw);
    featureCache[feature] = { raw, valid, min: min(valid), max: max(valid), nullCount: raw.length - valid.length };
  }
  return featureCache[feature];
}

function getGroupValues(feature, groupKey, groupValue) {
  const raw = inflexionData.filter((d) => d[groupKey] === groupValue).map((d) => d[feature]);
  return toValidNumbers(raw);
}

function term(label, glossaryKey) {
  const def = GLOSSARY[glossaryKey] || "";
  return `<span class="term" title="${def.replace(/"/g, "&quot;")}">${label}</span>`;
}

function init() {
  renderSidebar();
  renderTabs();
  document.getElementById("tabs").addEventListener("click", (e) => {
    const btn = e.target.closest(".tab-btn");
    if (!btn) return;
    selectTab(btn.dataset.tab);
  });
  document.getElementById("app-view-switch").addEventListener("click", (e) => {
    const btn = e.target.closest(".view-btn");
    if (!btn) return;
    selectView(btn.dataset.view);
  });
  renderAll();
}

function selectView(view) {
  state.view = view;
  document.querySelectorAll(".view-btn").forEach((btn) => btn.classList.toggle("active", btn.dataset.view === view));
  document.getElementById("view-explorer").hidden = view !== "explorer";
  document.getElementById("view-crossing").hidden = view !== "crossing";
  document.getElementById("view-combo").hidden = view !== "combo";
  document.getElementById("view-signal").hidden = view !== "signal";
  if (view === "crossing") renderCrossingView();
  else if (view === "combo") renderComboView();

}

function renderSidebar() {

    li.className = "feature-item";
    li.dataset.feature = feature;
    li.innerHTML = `
      <div class="feature-item-name">${FEATURE_INFO[feature].label}</div>
      <div class="feature-item-range">min ${formatNum(info.min, 3)} · max ${formatNum(info.max, 3)}</div>

}

function renderTabs() {

function renderOutlierList(values) {
  const info = iqrOutliers(values);
  if (info.count === 0) return `<p class="explain-text">Aucun outlier détecté (méthode IQR × 1,5) sur cet échantillon.</p>`;

  const sorted = info.outliers.slice().sort((a, b) => a - b);
  return `<p class="explain-text">${term("Outliers", "outlier")} détectés (méthode IQR × 1,5) : ${sorted.map((v) => formatNum(v, 4)).join(", ")}.</p>`;

function renderComparisonTab(container, config) {
  const feature = state.feature;

  const statsA = describe(valuesA);
  const statsB = describe(valuesB);
  const colorA = COLORS[groupA];
  const colorB = COLORS[groupB];
  const d = robustCohensD(valuesA, valuesB);
  const isOutcomeTab = config.key === "Outcome";
  const bestInterval = isOutcomeTab ? getBestIntervalForFeature(feature) : null;

  container.innerHTML = `
    <div class="panel">
      <div class="chart-legend">

      <p class="chart-note">Axe visuel cadré sur P1–P99 de l'ensemble des bougies valides ; 100 % des bougies de chaque groupe sont utilisées dans les calculs.</p>
      <p class="explain-text">Histogrammes superposés (transparence) de la feature pour les deux groupes, afin de comparer visuellement leur répartition.</p>
    </div>

    <div class="panel">
      <h3>Boxplots</h3>
      <p class="explain-text">Chaque boîte va du premier au troisième quartile (${term("IQR", "iqr")} = étendue de la boîte), la ligne centrale est la ${term("médiane", "median")}. Les points isolés sont des ${term("outliers", "outlier")}.</p>
      <div class="chart-container" id="cmp-box-chart"></div>
    </div>

    <div class="panel">
      <h3>Tableau comparatif</h3>
      <table class="stat-table">
        <thead><tr><th>Groupe</th><th>n</th><th>Moyenne</th><th>${term("Médiane", "median")}</th><th>${term("Écart-type", "stddev")}</th><th>${term("Outliers", "outlier")}</th></tr></thead>
        <tbody>
          <tr><td>${groupA}</td><td>${statsA.n}</td><td>${formatNum(statsA.mean)}</td><td>${formatNum(statsA.median)}</td><td>${formatNum(statsA.stdDev)}</td><td>${statsA.outlierCount}</td></tr>
          <tr><td>${groupB}</td><td>${statsB.n}</td><td>${formatNum(statsB.mean)}</td><td>${formatNum(statsB.median)}</td><td>${formatNum(statsB.stdDev)}</td><td>${statsB.outlierCount}</td></tr>
        </tbody>
      </table>
    </div>

    <div class="panel">
      <h3>Conclusion</h3>
      <p class="synthesis-text">${buildSynthesisSentence(groupA, statsA, groupB, statsB)}</p>
      ${renderEffectSizeRow(d)}
    </div>

    ${isOutcomeTab ? `<div class="panel"><h3>Intervalle au meilleur ratio observé</h3>${renderBestIntervalContent(bestInterval)}</div>` : ""}
  `;

  const p1 = describe(info.valid).percentiles[0.01];
  const p99 = describe(info.valid).percentiles[0.99];

  renderHistogram(document.getElementById("cmp-hist-chart"), {
    series: [{ values: valuesA, label: groupA, color: colorA }, { values: valuesB, label: groupB, color: colorB }],
    p1, p99, markOutliers: false,
    highlightRange: bestInterval ? [bestInterval.lo, bestInterval.hi] : null,
  });

  renderBoxplot(document.getElementById("cmp-box-chart"), {
    groups: [{ label: groupA, values: valuesA, color: colorA }, { label: groupB, values: valuesB, color: colorB }],
    domain: [info.min, info.max],
  });
}

function renderEffectSizeRow(d) {
  if (d === null) {
    return `<p class="explain-text">${term("Cohen's d robuste", "cohend")} indisponible (dispersion nulle ou échantillon trop petit dans un des deux groupes).</p>`;
  }
  const level = cohensDLevel(Math.abs(d));
  return `
    <div class="effect-size-row">
      <span class="effect-size-badge ${level.cls}">${level.label}</span>
      <span class="effect-size-value">${term("Cohen's d robuste", "cohend")} = ${formatNum(d, 3)}</span>
    </div>
    <p class="explain-text">Niveaux de lecture : &lt; 0,2 très faible · &lt; 0,5 faible · &lt; 0,8 modérée · ≥ 0,8 marquée. Ceci décrit l'écart observé dans cet échantillon, ce n'est ni un signal validé ni une garantie pour de futures observations.</p>
  `;
}

function buildSynthesisSentence(groupA, statsA, groupB, statsB) {
  if (statsA.n === 0 && statsB.n === 0) return `Aucune donnée valide disponible pour ${groupA} ou ${groupB} sur cette feature (n=0 des deux côtés) ; aucune comparaison possible.`;
  if (statsA.n === 0 || statsB.n === 0) {
    const empty = statsA.n === 0 ? groupA : groupB;
    return `Le groupe ${empty} ne contient aucune bougie valide pour cette feature (n=0) ; aucune comparaison n'est possible.`;
  }
  return `Dans cet échantillon, la médiane du groupe ${groupA} est de ${formatNum(statsA.median)} contre ${formatNum(statsB.median)} pour ${groupB} (n=${statsA.n} vs n=${statsB.n}).`;
}

function renderBestIntervalContent(best) {
  if (!best) {
    return `<p class="explain-text">Aucun intervalle suffisamment représenté n'a pu être identifié pour cette feature (n_total ≥ ${MIN_INTERVAL_N} non atteint).</p>`;
  }
  return `
    <div class="interval-summary">
      <div class="interval-stat"><span class="interval-stat-label">Plage</span><span class="interval-stat-value">[${formatNum(best.lo, 4)} — ${formatNum(best.hi, 4)}]</span></div>
      <div class="interval-stat"><span class="interval-stat-label">n_WIN</span><span class="interval-stat-value">${best.nWin}</span></div>
      <div class="interval-stat"><span class="interval-stat-label">n_LOSS</span><span class="interval-stat-value">${best.nLoss}</span></div>
      <div class="interval-stat"><span class="interval-stat-label">n_total</span><span class="interval-stat-value">${best.nTotal}</span></div>
      <div class="interval-stat"><span class="interval-stat-label">Ratio WIN</span><span class="interval-stat-value">${formatNum(best.ratio * 100, 1)} %</span></div>
      <div class="interval-stat"><span class="interval-stat-label">${term("Score de Wilson", "wilson")}</span><span class="interval-stat-value">${formatNum(best.score, 3)}</span></div>
    </div>
    <p class="explain-text">C'est ce score (indice de confiance), et non le ratio brut, qui a servi à choisir cet intervalle : il tient compte du nombre de bougies. La bande surlignée sur l'histogramme ci-dessus repère cet intervalle.</p>
    <p class="warning-text">Cet intervalle est celui qui présente le meilleur score observé sur cet échantillon historique de bougies d'inflexion (ratio ajusté au nombre d'observations). Il ne s'agit pas d'un signal validé ni d'une garantie pour de futures observations — de nombreuses combinaisons d'intervalles ont été testées, ce qui augmente le risque de tomber sur un résultat favorable par hasard.</p>
  `;
}

function renderCrossingView() {
  const container = document.getElementById("view-crossing");
  const result = computeCrossing(FEATURES);
  const final = result.final;

  const excludedNote = result.excluded.length
    ? `<p class="crossing-empty-note">Feature(s) exclue(s) du croisement, faute d'intervalle atteignant n_total ≥ ${MIN_INTERVAL_N} : ${result.excluded.map((f) => FEATURE_INFO[f].label).join(", ")}.</p>`
    : "";

  const finalResultHtml = final.nTotal === 0
    ? `<p class="crossing-empty-note">Aucune bougie ne satisfait les ${result.ordered.length} conditions simultanément (n_total = 0).</p>`
    : `
      <div class="crossing-result-row">
        <div class="interval-stat"><span class="interval-stat-label">n_total</span><span class="interval-stat-value">${final.nTotal}</span></div>
        <div class="interval-stat"><span class="interval-stat-label">n_WIN</span><span class="interval-stat-value">${final.nWin}</span></div>
        <div class="interval-stat"><span class="interval-stat-label">n_LOSS</span><span class="interval-stat-value">${final.nLoss}</span></div>
        <div class="interval-stat"><span class="interval-stat-label">Ratio WIN</span><span class="interval-stat-value">${formatNum((final.nWin / final.nTotal) * 100, 1)} %</span></div>
      </div>
    `;

  const funnelRows = result.funnel.map((row) => {
    const featureLabel = row.feature === null ? "(aucune — échantillon complet)" : FEATURE_INFO[row.feature].label;
    const intervalLabel = row.interval ? `[${formatNum(row.interval.lo, 4)} — ${formatNum(row.interval.hi, 4)}]` : "—";
    return `<tr><td>${row.step}</td><td>${featureLabel}</td><td>${intervalLabel}</td><td>${row.nTotal}</td><td>${row.nWin}</td><td>${row.nLoss}</td></tr>`;
  }).join("");

  container.innerHTML = `
    <div class="crossing-header">
      <h2>Croisement des intervalles</h2>
      <p>Combine les 12 intervalles individuellement optimisés (section précédente) — analyse séparée du reste, à haut risque de sur-ajustement. Aucune stratégie, aucune règle d'entrée.</p>
    </div>

    <div class="warning-box-strong">
      Ce résultat croise ${result.ordered.length} intervalles déjà individuellement optimisés sur le même échantillon de ${inflexionData.length} bougies d'inflexion. Le risque de sur-ajustement est très élevé : ce chiffre reflète très probablement des coïncidences statistiques plutôt qu'un phénomène réel et reproductible. Le tableau ci-dessous montre comment l'échantillon rétrécit à mesure que les conditions s'accumulent — plus il devient petit, moins le résultat est fiable. Ceci n'est en aucun cas une stratégie, une règle d'entrée ou une recommandation.
    </div>

    <div class="panel">
      <h3>Résultat final (les ${result.ordered.length} conditions appliquées simultanément)</h3>
      ${finalResultHtml}
      ${excludedNote}
    </div>

    <div class="panel">
      <h3>Tableau entonnoir</h3>
      <p class="explain-text">Features ajoutées une par une, triées par score de Wilson décroissant (convention arbitraire parmi d'autres possibles). Chaque ligne applique en plus l'intervalle au meilleur score de la feature indiquée.</p>
      <div style="overflow-x:auto">
        <table class="funnel-table">
          <thead><tr><th>Étape</th><th>Feature ajoutée</th><th>Intervalle appliqué</th><th>n restant</th><th>n_WIN</th><th>n_LOSS</th></tr></thead>
          <tbody>${funnelRows}</tbody>
        </table>
      </div>
    </div>
  `;
}

function renderComboView() {
  const container = document.getElementById("view-combo");
  const combo = computeGreedyBestCombination(FEATURES);
  const naive = computeCrossing(FEATURES);
  const final = combo.final;
  const usedRows = combo.steps.slice(1);

  const unusedNote = combo.featuresUnused.length
    ? `<p class="crossing-empty-note">Features non retenues dans cette combinaison (aucune n'a amélioré le score au moment où elle a été testée) : ${combo.featuresUnused.map((f) => FEATURE_INFO[f].label).join(", ")}.</p>`
    : `<p class="crossing-empty-note">Les ${FEATURES.length} features ont toutes été retenues par cette recherche.</p>`;

  const finalResultHtml = final.nTotal === 0
    ? `<p class="crossing-empty-note">Aucune combinaison exploitable n'a été trouvée.</p>`
    : `
      <div class="crossing-result-row">
        <div class="interval-stat"><span class="interval-stat-label">Features retenues</span><span class="interval-stat-value">${usedRows.length} / ${FEATURES.length}</span></div>
        <div class="interval-stat"><span class="interval-stat-label">n_total</span><span class="interval-stat-value">${final.nTotal}</span></div>
        <div class="interval-stat"><span class="interval-stat-label">n_WIN</span><span class="interval-stat-value">${final.nWin}</span></div>
        <div class="interval-stat"><span class="interval-stat-label">n_LOSS</span><span class="interval-stat-value">${final.nLoss}</span></div>
        <div class="interval-stat"><span class="interval-stat-label">Ratio WIN</span><span class="interval-stat-value">${formatNum((final.nWin / final.nTotal) * 100, 1)} %</span></div>
        <div class="interval-stat"><span class="interval-stat-label">${term("Score de Wilson", "wilson")}</span><span class="interval-stat-value">${formatNum(final.score, 3)}</span></div>
      </div>
    `;

  const stepsRows = combo.steps.map((row) => {
    const featureLabel = row.feature === null ? "(aucune — échantillon complet)" : FEATURE_INFO[row.feature].label;
    const intervalLabel = row.interval ? `[${formatNum(row.interval.lo, 4)} — ${formatNum(row.interval.hi, 4)}]` : "—";
    return `<tr><td>${row.step}</td><td>${featureLabel}</td><td>${intervalLabel}</td><td>${row.nTotal}</td><td>${row.nWin}</td><td>${row.nLoss}</td><td>${formatNum(row.score, 3)}</td></tr>`;
  }).join("");

  container.innerHTML = `
    <div class="crossing-header">
      <h2>Meilleure combinaison observée</h2>
      <p>Cherche, parmi les ${FEATURES.length} features, une combinaison conjointe d'intervalles qui maximise le score de Wilson de l'échantillon résultant — sans imposer que chaque feature soit prise à son propre intervalle individuellement optimal (celui affiché dans l'onglet WIN vs LOSS).</p>
    </div>

    <div class="panel">
      <h3>Méthode — recherche gloutonne, pas exhaustive</h3>
      <p class="explain-text">
        À chaque étape, pour chaque feature pas encore retenue, l'algorithme teste tous ses intervalles candidats (101 percentiles) <strong>sur l'échantillon déjà filtré par les étapes précédentes</strong> — pas sur l'échantillon complet — et retient la feature (avec son intervalle) qui améliore le plus le score de Wilson obtenu. Il s'arrête dès qu'aucune feature restante n'améliore ce score, ou si le plancher n_total ≥ ${MIN_INTERVAL_N} n'est plus atteignable pour aucune d'elles.
      </p>
      <p class="explain-text">
        C'est une recherche <strong>gloutonne</strong> (à chaque étape, le meilleur choix immédiat est retenu, sans jamais revenir en arrière), pas une recherche exhaustive : tester toutes les combinaisons possibles des intervalles des ${FEATURES.length} features représenterait un nombre de combinaisons bien trop élevé pour être calculé. Cette méthode ne garantit donc pas de trouver LA meilleure combinaison possible parmi toutes celles imaginables — seulement une bonne combinaison trouvée par cette exploration progressive.
      </p>
      <p class="explain-text">
        Pour comparaison : le croisement direct des ${FEATURES.length} intervalles déjà individuellement optimisés (section "Croisement des intervalles") donne n_total = ${naive.final.nTotal} sur cet échantillon. La combinaison ci-dessous est différente : les intervalles retenus par feature ne sont pas forcément ceux qui sont individuellement optimaux pour cette feature prise isolément.
      </p>
    </div>

    <div class="warning-box-strong">
      Cette recherche teste un nombre de combinaisons encore plus élevé que le simple croisement des intervalles individuels de la section précédente. Le risque de sur-ajustement est donc au moins aussi élevé, probablement plus : ce résultat reflète très probablement des coïncidences statistiques propres à cet échantillon historique de ${inflexionData.length} bougies, et non un phénomène réel ou reproductible sur de futures observations. Ceci n'est en aucun cas une stratégie, une règle d'entrée ou une recommandation.
    </div>

    <div class="panel">
      <h3>Résultat de la combinaison trouvée</h3>
      ${finalResultHtml}
      ${unusedNote}
    </div>

    <div class="panel">
      <h3>Construction étape par étape</h3>
      <p class="explain-text">Chaque étape ajoute la feature (et son intervalle) qui améliore le plus le score de Wilson à ce moment-là, en repartant de l'échantillon déjà filtré par les étapes précédentes.</p>
      <div style="overflow-x:auto">
        <table class="funnel-table">
          <thead><tr><th>Étape</th><th>Feature ajoutée</th><th>Intervalle appliqué</th><th>n restant</th><th>n_WIN</th><th>n_LOSS</th><th>Score de Wilson</th></tr></thead>
          <tbody>${stepsRows}</tbody>
        </table>
      </div>
    </div>
  `;
}

function renderSignalOverviewView() {
  const container = document.getElementById("view-signal");

  const rows = FEATURES.map((feature) => {
    const valuesWin = getGroupValues(feature, "Outcome", "WIN");
    const valuesLoss = getGroupValues(feature, "Outcome", "LOSS");
    const auc = probabilityOfSuperiority(valuesWin, valuesLoss);
    const strength = auc === null ? null : Math.abs(auc - 0.5) * 2;
    return { feature, auc, strength, medianWin: median(valuesWin), medianLoss: median(valuesLoss), nWin: valuesWin.length, nLoss: valuesLoss.length };
  });

  const ranked = rows.slice().sort((a, b) => {
    const sa = a.strength === null ? -1 : a.strength;
    const sb = b.strength === null ? -1 : b.strength;
    return sb - sa;
  });
  const top = ranked[0];

  let verdict;
  if (!top || top.strength === null) {
    verdict = "Impossible de calculer une séparation exploitable sur cet échantillon.";
  } else if (top.strength < 0.10) {
    verdict = `Sur cet échantillon, aucune feature prise isolément ne sépare les groupes WIN et LOSS de façon notable — la séparation la plus marquée observée est de ${formatNum(top.strength * 100, 1)} % (0 % = mélange total, 100 % = séparation quasi totale). C'est très proche du mélange total : à elle seule, aucune feature ne distingue clairement un WIN d'un LOSS dans cet échantillon de bougies.`;
  } else if (top.strength < 0.25) {
    verdict = `La séparation la plus marquée observée entre WIN et LOSS, feature par feature, reste faible : ${formatNum(top.strength * 100, 1)} % pour ${FEATURE_INFO[top.feature].label} (0 % = mélange total, 100 % = séparation quasi totale).`;
  } else if (top.strength < 0.45) {
    verdict = `Une séparation modérée est observée pour ${FEATURE_INFO[top.feature].label} (${formatNum(top.strength * 100, 1)} %), la plus marquée des ${FEATURES.length} features prises individuellement.`;
  } else if (top.strength < 0.70) {
    verdict = `Une séparation nette est observée pour ${FEATURE_INFO[top.feature].label} (${formatNum(top.strength * 100, 1)} %) entre les groupes WIN et LOSS de cet échantillon.`;
  } else {
    verdict = `Une séparation quasi totale est observée pour ${FEATURE_INFO[top.feature].label} (${formatNum(top.strength * 100, 1)} %) : les valeurs WIN et LOSS de cette feature se chevauchent très peu dans cet échantillon.`;
  }

  const rowsHtml = ranked.map((r) => {
    const aucLabel = r.auc === null ? "—" : `${formatNum(r.auc * 100, 1)} %`;
    const strengthLabel = r.strength === null ? "—" : `${formatNum(r.strength * 100, 1)} %`;
    return `<tr><td>${FEATURE_INFO[r.feature].label}</td><td>${strengthLabel}</td><td>${aucLabel}</td><td>${formatNum(r.medianWin)}</td><td>${formatNum(r.medianLoss)}</td><td>${r.nWin}</td><td>${r.nLoss}</td></tr>`;
  }).join("");

  container.innerHTML = `
    <div class="crossing-header">
      <h2>Y a-t-il un signal dans ce dataset ?</h2>
      <p>Pour chacune des ${FEATURES.length} features, prise isolément : à quel point les valeurs WIN et LOSS des bougies d'inflexion sont-elles séparées (plutôt que mélangées) dans cet échantillon ? Contrairement aux sections précédentes, il n'y a ici ni recherche d'intervalle ni combinaison testée — un seul indicateur descriptif par feature, calculé une fois.</p>
    </div>

    <div class="panel">
      <h3>Indicateur utilisé : probabilité de supériorité (statistique de Mann-Whitney)</h3>
      <p class="explain-text">
        Pour une feature donnée, on tire au hasard une valeur du groupe WIN et une valeur du groupe LOSS : dans quel pourcentage des cas la valeur WIN est-elle la plus grande ? Ce pourcentage vaut 50 % si les deux groupes sont indiscernables (mélange total), et s'approche de 0 % ou 100 % si les deux groupes sont presque totalement séparés sur cette feature (quasi-unanimité). La "force de séparation" ci-dessous est l'écart à 50 %, ramené sur une échelle de 0 % (aucune séparation) à 100 % (séparation totale).
      </p>
      <p class="explain-text">
        C'est un indicateur purement descriptif calculé une seule fois par feature sur l'échantillon complet — il ne recherche ni seuil ni combinaison, contrairement aux sections "Croisement des intervalles" et "Meilleure combinaison observée", et il est donc beaucoup moins exposé au risque de sur-ajustement que ces dernières.
      </p>
    </div>

    <div class="panel">
      <h3>Constat sur cet échantillon</h3>
      <p class="synthesis-text">${verdict}</p>
      <p class="explain-text">Un chevauchement important entre WIN et LOSS sur une feature isolée ne signifie pas que cette feature est sans utilité en combinaison avec d'autres (voir la section "Meilleure combinaison observée") — seulement qu'elle ne sépare pas fortement les deux groupes à elle seule.</p>
    </div>

    <div class="panel">
      <h3>Détail par feature</h3>
      <p class="explain-text">Triées par force de séparation décroissante (ordre de lecture, pas un classement de "meilleure feature").</p>
      <div style="overflow-x:auto">
        <table class="funnel-table">
          <thead><tr><th>Feature</th><th>Force de séparation</th><th>Probabilité de supériorité (WIN &gt; LOSS)</th><th>Médiane WIN</th><th>Médiane LOSS</th><th>n WIN</th><th>n LOSS</th></tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
    </div>
  `;
}

document.addEventListener("DOMContentLoaded", init);
  </script>
</body>
