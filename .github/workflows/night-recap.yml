name: Night Recap - daily generation

# Target 09:00 Quebec time year-round, including EDT/EST transitions.
# GitHub schedules are best-effort; 09:30 and 10:30 are guarded recovery
# pings if a scheduled job is delayed/dropped or generation fails. The
# backend enforces one successful generation per local day and a one-hour
# failure cooldown. Never force a refresh here: successful recovery pings
# must not repeat the paid research/generation work.
on:
  schedule:
    - cron: "0 9 * * *"
      timezone: "America/Toronto"
    - cron: "30 9,10 * * *"
      timezone: "America/Toronto"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: night-recap
  cancel-in-progress: false

jobs:
  auto-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate today's Night Recap if due
        env:
          BACKEND_URL: ${{ secrets.GOLD_TERMINAL_BACKEND_URL }}
          INGEST_SECRET: ${{ secrets.INTERNAL_INGEST_SECRET }}
        run: |
          response=$(curl --fail --show-error --silent \
            --max-time 300 \
            -X POST "${BACKEND_URL}/api/internal/gold-overnight/auto-run" \
            -H "X-Internal-Ingest-Secret: ${INGEST_SECRET}")
          printf '%s\n' "$response"
          RECAP_RESPONSE="$response" python3 - <<'PY'
          import json
          import os
          import sys

          result = json.loads(os.environ["RECAP_RESPONSE"])
          if not isinstance(result, dict):
              sys.exit("Invalid Night Recap response.")
          if result.get("ran") is True:
              print("Night Recap generated successfully.")
          elif (
              result.get("ran") is False
              and isinstance(result.get("reason"), str)
              and result["reason"].startswith("already succeeded today (last success ")
          ):
              print("Night Recap already generated today; no duplicate generation.")
          else:
              sys.exit("Night Recap was not generated; see the backend reason above.")
          PY
