name: CI

# Runs on every push and pull request — locked-dependency install,
# type-check (this project's substitute for lint: no ESLint config exists
# yet), the full test suite (schema/fixture validation included — see
# tests/gold-market-state-schema.test.ts, tests/sunday-read.test.ts), and a
# production build. DB-backed tests (tests/sunday-read-ingestion.test.ts,
# tests/gold-market-state-ingestion.test.ts) self-skip when no database is
# configured (see loadAppConfig().db) — CI intentionally runs without live
# Supabase credentials, so those specific assertions are exercised locally
# against the real Postgres instance instead (see each file's header
# comment for how to run them that way).
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"

      # The Platform's v6 fixtures are pinned inside a verified archive rather
      # than committed as an extracted tree. Materialize them in every clean
      # runner before either suite can read them, then execute the canonical
      # Brain validator against that exact pinned contract.
      - name: Materialize and validate pinned Brain v6 contract
        run: |
          python3 gold-sunday-read/brain-v6/materialize.py
          npm ci --prefix gold-sunday-read/brain-v6/reference/brain
          # Patch installed tooling without altering the historical manifest/lock.
          npm update fast-uri --no-save --package-lock=false --ignore-scripts --prefix gold-sunday-read/brain-v6/reference/brain
          python3 gold-sunday-read/brain-v6/materialize.py
          npm test --prefix gold-sunday-read/brain-v6/reference/brain

      - name: Install dependencies (locked)
        run: npm ci

      - name: Reject known vulnerable dependencies
        run: npm audit --audit-level=moderate

      - name: Type-check (backend, frontend, contracts)
        run: npm run typecheck

      - name: Minimal env file (DB-backed tests self-skip when unconfigured)
        run: touch apps/backend/.env

      - name: Test (includes schema/fixture validation)
        run: npm test

      - name: Production build
        run: npm run build
