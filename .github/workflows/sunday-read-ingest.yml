name: Sunday Read - Drive ingestion

# Compatibility wake-up only: this uses the same enriched, sealed ingestion
# as gold-state-refresh.yml. An Action never performs market research.
on:
  schedule:
    # UTC envelope covers Sunday 08:00-12:00 America/New_York across DST.
    - cron: "*/20 12-17 * * 0"
  workflow_dispatch: {}

concurrency:
  group: gold-state-refresh
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh sealed Gold states (America/New_York window)
        env:
          BACKEND_URL: ${{ secrets.GOLD_TERMINAL_BACKEND_URL }}
          INGEST_SECRET: ${{ secrets.INTERNAL_INGEST_SECRET }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "workflow_dispatch" ]; then
            NOW_DOW=$(TZ=America/New_York date +%u)
            NOW_HOUR=$(TZ=America/New_York date +%H)
            if [ "$NOW_DOW" != "7" ] || [ "$NOW_HOUR" -lt 8 ] || [ "$NOW_HOUR" -gt 12 ]; then
              echo "Outside the Sunday ingestion window."
              exit 0
            fi
          fi
          if [ -z "${BACKEND_URL:-}" ] || [ -z "${INGEST_SECRET:-}" ]; then
            echo "::error::Gold backend URL or ingestion secret is unavailable."
            exit 1
          fi
          RESPONSE=$(curl --fail --show-error --silent --max-time 120 \
            -X POST "${BACKEND_URL%/}/internal/gold/refresh" \
            -H "X-Internal-Ingest-Secret: ${INGEST_SECRET}" \
            -H "Content-Type: application/json" \
            -d '{"expected_run_id":null}')
          echo "$RESPONSE" | jq -e '.run_id != null and (.run_id | type == "string")' >/dev/null
          {
            echo "### Sealed Gold refresh"
            echo "Selected run: $(echo "$RESPONSE" | jq -r '.run_id')"
            echo "This is an ingestion wake-up; the selected cutoff remains the publication cutoff."
          } >> "$GITHUB_STEP_SUMMARY"
